# The `digital-twin` agent preset: a CONVERSATION-FIRST agent for the digital
# avatar. Personality is injected by the dsh-twin host bundle through a
# `systemPrompt` section reading the twin config. To minimize a guest-facing
# avatar's attack surface, heavy/risky tools (shell, filesystem) are omitted —
# only model-facing rows that register into the host `tools` registry live
# here, so no `isolate` realm is needed (matching `standard`).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 {{model}} 驱动的数字分身。

# 共享记忆工具：主人经「分身设置」写入的知识种子存在 dsh-memory，
# 分身没有这个工具就读不到自己被喂的知识（曾致知识功能单向失效）。
- id: tool-memory
  name: '@dsh-extra/dsh-memory/tools'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
