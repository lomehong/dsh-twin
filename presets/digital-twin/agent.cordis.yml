# The `digital-twin` agent preset: a CONVERSATION-FIRST agent for the digital
# avatar. Personality is injected by the dsh-twin host bundle through a
# `systemPrompt` section reading the twin config. Shell/filesystem tools are
# restored for owner sessions (tail section, aligned with `standard`); the
# plain tool rows only register into the host `tools` registry, so they need
# no `isolate` realm. The compaction / delegation groups appended at the tail
# DO carry their own isolate realms (aligned with the `standard` preset).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 {{model}} 驱动的数字分身。

# 共享记忆工具：主人经「分身设置」写入的知识种子存在 dsh-memory。
# 注意：dsh-memory 是可选依赖，此行不写死在本文件——由 dsh-twin 宿主端在物化时
# 检测到 dsh-memory 已安装才追加（无条件写死会让未装 dsh-memory 的机器上
# 本预设因行不可解析而无法挂载）。

# 转人工：把「边界与转人工」人格字段从提示词承诺变成真实能力——
# 遇到权限不足/敏感操作/投诉时真正经 IM 通知主人。
- id: tool-twin-escalate
  name: '@dsh-extra/dsh-twin/tools'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 主人侧完整工具：shell 与文件系统（与 standard 预设对齐）──
# shell 两个工具按平台互斥启用（Win 上只启用 pwsh）；fs / fs-search 只注册
# 模型侧工具，`fs` 服务与策略仍在宿主组合中，无需 isolate realm。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# 御驿通信工具（dsh-yuyi）与共享记忆工具（dsh-memory）的行**不写死在本模板**：
# 两者都是可选依赖，行引用的包未安装时整份预设会被 discovery 判为不可挂载。
# 由宿主端 materializePreset 按安装状态在物化时追加（见 optionalRows）。

# ── 压缩（compaction）：长会话压缩 + 工具结果裁剪（与 standard 预设对齐）──
# compaction-basic 经 ctx.get 读取 toolResultPruner，所以 pruner 必须与其同 realm；
# tokenMeter 刻意留在宿主平面，此处行只解析宿主那一份实例。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流（delegation & workflows，与 standard 预设对齐）──
# `subagents` 注册表及其 spawn/fork 后端在宿主组合（进程单例），本预设只贡献
# 委派工具；workflows 无外部读者，故整组共享一个 entry-local realm。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 可选 provider（codex / claude-code）：未安装对应 Bundle 时保持 disabled，
    # 宿主可用不等于工具可用——装了 Bundle 后再删掉 disabled 行。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
