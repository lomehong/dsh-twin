# The `digital-twin` agent preset: a CONVERSATION-FIRST agent for the digital
# avatar. Personality is injected by the dsh-twin host bundle through a
# `systemPrompt` section reading the twin config. To minimize a guest-facing
# avatar's attack surface, heavy/risky tools (shell, filesystem) are omitted —
# only model-facing rows that register into the host `tools` registry live
# here, so no `isolate` realm is needed (matching `standard`).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 {{model}} 驱动的数字分身。

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
