    source: src/index.ts:PRESET_VERSION
  - detail: 宿主升级盯 slots/panel 面（main/sidebar.panellist 特性检测双写）、settings 命名空间注册时序（轮询）、systemPrompt AssembleContext 无身份信息（noteActor+WeakMap 既定方案）、dsh-tools alpha.3+ ToolDefinition.output 强制
    source: src/client/twin-hub.tsx:applyTwinHub
