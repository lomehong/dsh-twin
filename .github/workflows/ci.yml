name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc（legacy-peer-deps）已提交，npm ci 可直接解析 @deepseek-ai rc 包的 peer 冲突
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 发布包内容审计（dry-run）：每次提交就验证 files 白名单与入口完整性，不等发布才炸
      - run: node scripts/audit-pack.mjs
